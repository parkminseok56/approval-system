spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/approval_db?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: approval
    password: approval
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
